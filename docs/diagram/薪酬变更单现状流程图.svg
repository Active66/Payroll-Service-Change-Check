<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1450" font-family="'JetBrains Mono','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <style>
    text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e11d48"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 标题 -->
  <text x="40" y="48" fill="#0f172a" font-size="18" font-weight="700">薪酬变更单 · 现状（As-Is）流程图</text>
  <text x="40" y="70" fill="#64748b" font-size="10">依据六人访谈记录 36 项事实还原 · 主链路：客户确认 → 变更登记 → 双人核对 → 出具结果 · 全部为合成演练样本</text>

  <!-- 图例 -->
  <rect x="790" y="96" width="400" height="172" rx="8" fill="#ffffff" fill-opacity="0.75" stroke="#e2e8f0" stroke-width="1"/>
  <text x="806" y="118" fill="#0f172a" font-size="10" font-weight="700">图 例</text>
  <rect x="806" y="140" width="16" height="11" rx="5" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1.2"/>
  <text x="832" y="149" fill="#475569" font-size="9">起点 / 终点（客户侧 · 授权确认）</text>
  <rect x="806" y="166" width="16" height="11" rx="2" fill="rgba(14,116,144,0.1)" stroke="#0891b2" stroke-width="1.2"/>
  <text x="832" y="175" fill="#475569" font-size="9">人工作业步骤（无系统支撑）</text>
  <rect x="806" y="192" width="16" height="11" rx="2" fill="rgba(5,150,105,0.1)" stroke="#059669" stroke-width="1.2"/>
  <text x="832" y="201" fill="#475569" font-size="9">交接 / 复核确认（需留痕签字）</text>
  <polygon points="814,216 824,224 814,232 804,224" fill="rgba(217,119,6,0.08)" stroke="#d97706" stroke-width="1.2"/>
  <text x="832" y="227" fill="#475569" font-size="9">判断点（口径未定，全凭人工经验）</text>
  <line x1="804" y1="250" x2="824" y2="250" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="832" y="253" fill="#475569" font-size="9">异常 / 退回回路（虚线）</text>

  <!-- ============ 主流程连接线（先画线，后画框） ============ -->
  <!-- S1->S2 -->
  <line x1="560" y1="172" x2="560" y2="204" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- S2->S3 -->
  <line x1="560" y1="268" x2="560" y2="300" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- S3->S4 -->
  <line x1="560" y1="364" x2="560" y2="396" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- S4->D5 -->
  <line x1="560" y1="460" x2="560" y2="482" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- D5->S6 (是) -->
  <line x1="560" y1="588" x2="560" y2="622" stroke="#0891b2" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <text x="570" y="610" fill="#0891b2" font-size="8" font-weight="600">是</text>
  <!-- S6->S7 -->
  <line x1="560" y1="686" x2="560" y2="718" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- S7->S8 -->
  <line x1="560" y1="782" x2="560" y2="814" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- S8->S9 -->
  <line x1="560" y1="878" x2="560" y2="910" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- S9->D10 -->
  <line x1="560" y1="974" x2="560" y2="996" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- D10->S11 (是) -->
  <line x1="560" y1="1102" x2="560" y2="1136" stroke="#0891b2" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <text x="570" y="1124" fill="#0891b2" font-size="8" font-weight="600">是</text>
  <!-- S11->S12 -->
  <line x1="560" y1="1200" x2="560" y2="1232" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- D5 -> B1 (否) -->
  <line x1="660" y1="536" x2="798" y2="536" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-rose)"/>
  <text x="678" y="529" fill="#e11d48" font-size="8" font-weight="600">否 / 无法确认</text>
  <!-- B1 -> B2 -->
  <line x1="970" y1="567" x2="970" y2="599" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <!-- B2 -> 回双人核对（回路） -->
  <path d="M 800 632 H 760 V 429 H 716" fill="none" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-rose)"/>
  <text x="766" y="452" fill="#e11d48" font-size="8">退回重核</text>
  <!-- B2 -> B3 -->
  <line x1="970" y1="663" x2="970" y2="695" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-rose)"/>
  <text x="978" y="683" fill="#e11d48" font-size="8">仍无法确认</text>
  <!-- B3 -> 终点 -->
  <path d="M 1140 728 H 1200 V 1258 H 716" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="1226" y="1000" fill="#64748b" font-size="8" transform="rotate(-90 1226 1000)">人工确认后回归</text>

  <!-- D10 -> C1 (否) -->
  <line x1="660" y1="1050" x2="798" y2="1050" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-rose)"/>
  <text x="678" y="1043" fill="#e11d48" font-size="8" font-weight="600">否 / 有缺口</text>
  <!-- C1 -> 回复核 -->
  <path d="M 970 1019 V 943 H 716" fill="none" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-rose)"/>

  <!-- ============ 角色标注（左侧） ============ -->
  <g font-size="10" fill="#1e293b">
    <rect x="80" y="128" width="290" height="26" rx="13" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="92" y="138" width="6" height="6" rx="1" fill="#2563eb"/>
    <text x="108" y="145">客户 / 客户经理 · 发起变更</text>

    <rect x="80" y="224" width="290" height="26" rx="13" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="92" y="234" width="6" height="6" rx="1" fill="#0891b2"/>
    <text x="108" y="241">一线服务专员 · 林亦舟</text>

    <rect x="80" y="320" width="290" height="26" rx="13" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="92" y="330" width="6" height="6" rx="1" fill="#0891b2"/>
    <text x="108" y="337">一线服务专员 · 林亦舟</text>

    <rect x="80" y="416" width="290" height="26" rx="13" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="92" y="426" width="6" height="6" rx="1" fill="#0891b2"/>
    <text x="108" y="433">当班核对人（双人核对）</text>

    <rect x="80" y="523" width="290" height="26" rx="13" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="92" y="533" width="6" height="6" rx="1" fill="#d97706"/>
    <text x="108" y="540">一线服务专员 · 经验判断</text>

    <rect x="80" y="642" width="290" height="26" rx="13" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="92" y="652" width="6" height="6" rx="1" fill="#059669"/>
    <text x="108" y="659">项目流程协调员 · 唐映秋</text>

    <rect x="80" y="738" width="290" height="26" rx="13" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="92" y="748" width="6" height="6" rx="1" fill="#059669"/>
    <text x="108" y="755">业务负责人 · 顾明岚</text>

    <rect x="80" y="834" width="290" height="26" rx="13" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="92" y="844" width="6" height="6" rx="1" fill="#0891b2"/>
    <text x="108" y="851">客户协同代表 · 叶书</text>

    <rect x="80" y="930" width="290" height="26" rx="13" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="92" y="940" width="6" height="6" rx="1" fill="#059669"/>
    <text x="108" y="947">审核与质量负责人 · 傅景</text>

    <rect x="80" y="1037" width="290" height="26" rx="13" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="92" y="1047" width="6" height="6" rx="1" fill="#d97706"/>
    <text x="108" y="1054">审核与质量负责人 · 傅景</text>

    <rect x="80" y="1156" width="290" height="26" rx="13" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="92" y="1166" width="6" height="6" rx="1" fill="#0891b2"/>
    <text x="108" y="1173">叶书 + 复核团队（双周会）</text>

    <rect x="80" y="1245" width="290" height="26" rx="13" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="92" y="1255" width="6" height="6" rx="1" fill="#2563eb"/>
    <text x="108" y="1262">授权人员 · 人工签署</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,3">
    <line x1="370" y1="141" x2="408" y2="141"/>
    <line x1="370" y1="237" x2="408" y2="237"/>
    <line x1="370" y1="333" x2="408" y2="333"/>
    <line x1="370" y1="429" x2="408" y2="429"/>
    <line x1="370" y1="536" x2="448" y2="536"/>
    <line x1="370" y1="655" x2="408" y2="655"/>
    <line x1="370" y1="751" x2="408" y2="751"/>
    <line x1="370" y1="847" x2="408" y2="847"/>
    <line x1="370" y1="943" x2="408" y2="943"/>
    <line x1="370" y1="1050" x2="448" y2="1050"/>
    <line x1="370" y1="1169" x2="408" y2="1169"/>
    <line x1="370" y1="1258" x2="408" y2="1258"/>
  </g>

  <!-- ============ 主流程节点 ============ -->
  <!-- S1 客户确认 -->
  <rect x="410" y="110" width="300" height="62" rx="8" fill="#f8fafc"/>
  <rect x="410" y="110" width="300" height="62" rx="8" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1.6"/>
  <text x="560" y="136" fill="#1e293b" font-size="11.5" font-weight="600" text-anchor="middle">客户确认变更需求</text>
  <text x="560" y="154" fill="#64748b" font-size="9" text-anchor="middle">触发：变更邮件 / 群消息，截止时间口径不一</text>

  <!-- S2 变更登记 -->
  <rect x="410" y="206" width="300" height="62" rx="6" fill="#f8fafc"/>
  <rect x="410" y="206" width="300" height="62" rx="6" fill="rgba(14,116,144,0.1)" stroke="#0891b2" stroke-width="1.6"/>
  <text x="560" y="232" fill="#1e293b" font-size="11.5" font-weight="600" text-anchor="middle">变更登记（一线提交）</text>
  <text x="560" y="250" fill="#e11d48" font-size="9" text-anchor="middle">群消息先行、事后补表 → 回填时间 ≠ 发生时间</text>

  <!-- S3 人工对版 -->
  <rect x="410" y="302" width="300" height="62" rx="6" fill="#f8fafc"/>
  <rect x="410" y="302" width="300" height="62" rx="6" fill="rgba(14,116,144,0.1)" stroke="#0891b2" stroke-width="1.6"/>
  <text x="560" y="328" fill="#1e293b" font-size="11.5" font-weight="600" text-anchor="middle">变更邮件 × 月度表格人工对版</text>
  <text x="560" y="346" fill="#e11d48" font-size="9" text-anchor="middle">需回溯发生节点与受影响对象，最耗时环节</text>

  <!-- S4 双人核对 -->
  <rect x="410" y="398" width="300" height="62" rx="6" fill="#f8fafc"/>
  <rect x="410" y="398" width="300" height="62" rx="6" fill="rgba(14,116,144,0.1)" stroke="#0891b2" stroke-width="1.6"/>
  <text x="560" y="424" fill="#1e293b" font-size="11.5" font-weight="600" text-anchor="middle">双人核对关键字段</text>
  <text x="560" y="442" fill="#64748b" font-size="9" text-anchor="middle">系统建议不覆盖原值，人工确认不可省略</text>

  <!-- D5 判断 -->
  <polygon points="560,484 660,536 560,588 460,536" fill="#f8fafc"/>
  <polygon points="560,484 660,536 560,588 460,536" fill="rgba(217,119,6,0.1)" stroke="#d97706" stroke-width="1.6"/>
  <text x="560" y="531" fill="#1e293b" font-size="10" font-weight="600" text-anchor="middle">版本与关键</text>
  <text x="560" y="547" fill="#1e293b" font-size="10" font-weight="600" text-anchor="middle">字段可确认？</text>

  <!-- S6 版本交接 -->
  <rect x="410" y="624" width="300" height="62" rx="6" fill="#f8fafc"/>
  <rect x="410" y="624" width="300" height="62" rx="6" fill="rgba(5,150,105,0.1)" stroke="#059669" stroke-width="1.6"/>
  <text x="560" y="650" fill="#1e293b" font-size="11.5" font-weight="600" text-anchor="middle">版本交接</text>
  <text x="560" y="668" fill="#e11d48" font-size="9" text-anchor="middle">应列版本/未结项/截止时间/接收人，现状常只发「已处理」</text>

  <!-- S7 出具结果 -->
  <rect x="410" y="720" width="300" height="62" rx="6" fill="#f8fafc"/>
  <rect x="410" y="720" width="300" height="62" rx="6" fill="rgba(5,150,105,0.1)" stroke="#059669" stroke-width="1.6"/>
  <text x="560" y="746" fill="#1e293b" font-size="11.5" font-weight="600" text-anchor="middle">出具结果</text>
  <text x="560" y="764" fill="#64748b" font-size="9" text-anchor="middle">业务负责人正式确认，模型无审批权限</text>

  <!-- S8 客户反馈 -->
  <rect x="410" y="816" width="300" height="62" rx="6" fill="#f8fafc"/>
  <rect x="410" y="816" width="300" height="62" rx="6" fill="rgba(14,116,144,0.1)" stroke="#0891b2" stroke-width="1.6"/>
  <text x="560" y="842" fill="#1e293b" font-size="11.5" font-weight="600" text-anchor="middle">客户反馈 / 投诉登记</text>
  <text x="560" y="860" fill="#64748b" font-size="9" text-anchor="middle">登记原始问题·相关版本·恢复需求，禁止推测意图</text>

  <!-- S9 复核抽验 -->
  <rect x="410" y="912" width="300" height="62" rx="6" fill="#f8fafc"/>
  <rect x="410" y="912" width="300" height="62" rx="6" fill="rgba(5,150,105,0.1)" stroke="#059669" stroke-width="1.6"/>
  <text x="560" y="938" fill="#1e293b" font-size="11.5" font-weight="600" text-anchor="middle">复核签字 + 40 条样本抽验</text>
  <text x="560" y="956" fill="#64748b" font-size="9" text-anchor="middle">金额差异须逐条定位来源并关联复核记录</text>

  <!-- D10 判断 -->
  <polygon points="560,998 660,1050 560,1102 460,1050" fill="#f8fafc"/>
  <polygon points="560,998 660,1050 560,1102 460,1050" fill="rgba(217,119,6,0.1)" stroke="#d97706" stroke-width="1.6"/>
  <text x="560" y="1045" fill="#1e293b" font-size="10" font-weight="600" text-anchor="middle">来源定位</text>
  <text x="560" y="1061" fill="#1e293b" font-size="10" font-weight="600" text-anchor="middle">全覆盖？</text>

  <!-- S11 周复盘 -->
  <rect x="410" y="1138" width="300" height="62" rx="6" fill="#f8fafc"/>
  <rect x="410" y="1138" width="300" height="62" rx="6" fill="rgba(14,116,144,0.1)" stroke="#0891b2" stroke-width="1.6"/>
  <text x="560" y="1164" fill="#1e293b" font-size="11.5" font-weight="600" text-anchor="middle">周复盘（改完再核）</text>
  <text x="560" y="1182" fill="#64748b" font-size="9" text-anchor="middle">误报·漏报·未确认项，双方共同复盘</text>

  <!-- S12 终点 -->
  <rect x="410" y="1234" width="300" height="48" rx="24" fill="#f8fafc"/>
  <rect x="410" y="1234" width="300" height="48" rx="24" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1.6"/>
  <text x="560" y="1263" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">试点批次结束 · 授权人员确认</text>

  <!-- ============ 异常分支节点 ============ -->
  <rect x="800" y="505" width="340" height="62" rx="6" fill="#f8fafc"/>
  <rect x="800" y="505" width="340" height="62" rx="6" fill="rgba(225,29,72,0.08)" stroke="#e11d48" stroke-width="1.5"/>
  <text x="970" y="531" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">回溯原始版本 · 判断责任环节</text>
  <text x="970" y="549" fill="#64748b" font-size="9" text-anchor="middle">按发生时的原始版本追溯，如截止后补发、旧金额残留</text>

  <rect x="800" y="601" width="340" height="62" rx="6" fill="#f8fafc"/>
  <rect x="800" y="601" width="340" height="62" rx="6" fill="rgba(225,29,72,0.08)" stroke="#e11d48" stroke-width="1.5"/>
  <text x="970" y="627" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">退回原单重核</text>
  <text x="970" y="645" fill="#64748b" font-size="9" text-anchor="middle">不自动改写原值，保留原行与作废原因</text>

  <rect x="800" y="697" width="340" height="62" rx="6" fill="#f8fafc"/>
  <rect x="800" y="697" width="340" height="62" rx="6" fill="rgba(225,29,72,0.08)" stroke="#e11d48" stroke-width="1.5"/>
  <text x="970" y="723" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">人工处理队列</text>
  <text x="970" y="741" fill="#64748b" font-size="9" text-anchor="middle">无法确认版本或关键字段即入队，必要时暂停试点</text>

  <rect x="800" y="1019" width="340" height="62" rx="6" fill="#f8fafc"/>
  <rect x="800" y="1019" width="340" height="62" rx="6" fill="rgba(225,29,72,0.08)" stroke="#e11d48" stroke-width="1.5"/>
  <text x="970" y="1045" fill="#1e293b" font-size="11" font-weight="600" text-anchor="middle">不予通过 · 追加样本重跑</text>
  <text x="970" y="1063" fill="#64748b" font-size="9" text-anchor="middle">存在缺口不得默认通过，补齐后重新复核</text>

  <!-- ============ 现状工具底座 ============ -->
  <rect x="80" y="1300" width="1100" height="112" rx="12" fill="rgba(217,119,6,0.04)" stroke="#d97706" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="98" y="1322" fill="#b45309" font-size="10" font-weight="700">现状工具底座 · 三类工具并行，薪酬变更单无统一关联编号</text>

  <rect x="100" y="1336" width="190" height="52" rx="6" fill="#f8fafc"/>

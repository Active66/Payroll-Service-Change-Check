name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 静态检查
        run: python -m pyflakes src scripts tests examples

      - name: 单元与端到端测试
        run: python -m pytest -q --maxfail=1

      - name: 构建索引
        run: python -m my_tool build
        env:
          PYTHONPATH: src

      - name: 检索评测（阈值卡口）
        run: python scripts/eval_retrieval.py

      - name: 冒烟：单次提问
        run: |
          python -m my_tool ask "冻结期内可以改银行账户吗？" | tee smoke.txt
          # 答案必须带引用角标，否则说明引用链路断了
          grep -q "\[1\]" smoke.txt
        env:
          PYTHONPATH: src

      - name: 冒烟：SSE 流式接口
        run: |
          # 真起服务打一遍：单元测试用的是 ASGITransport，绕过了 uvicorn 的缓冲与分帧，
          # 这里才能验证"真的在流式返回"。
          python -m my_tool serve --port 8010 &
          SRV=$!
          for _ in $(seq 1 20); do
            sleep 1
            curl -sf http://127.0.0.1:8010/healthz > /dev/null && break
          done

          curl -sS http://127.0.0.1:8010/healthz | tee health.json
          curl -sS -N -X POST http://127.0.0.1:8010/chat \
            -H "Content-Type: application/json" \
            -d '{"question":"冻结期内可以改银行账户吗？"}' | tee sse.txt

          grep -q "event: citations" sse.txt
          grep -q "event: delta"     sse.txt
          grep -q "event: done"      sse.txt
          # 正常问题不该出现错误帧
          if grep -q "event: error" sse.txt; then exit 1; fi
          kill $SRV || true
        env:
          PYTHONPATH: src
